<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dr. Ai — Clinical Intelligence</title>
    <meta name="description" content="Your empathetic AI medical partner. Professional, intelligent tele-triage to help you understand your symptoms instantly." />

    <!-- Premium Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                50:  '#f0fdf0',
                100: '#dcfcdc',
                200: '#bbf7bb',
                300: '#86ef86',
                400: '#4ade80',
                500: '#A4DD00',
                600: '#2d6a00',
                700: '#1a4d00',
                800: '#14390a',
                900: '#0f2d07',
              },
              clinical: {
                bg: '#f8f9fa',
                sidebar: '#ffffff',
                card: '#ffffff',
                border: '#e9ecef',
                text: '#1a1a1a',
                muted: '#6c757d',
                green: '#2d6a00',
                'green-light': '#A4DD00',
                'green-dark': '#1a4d00',
                'green-bg': '#f0f7e8',
              }
            },
          }
        }
      }

  <body class="bg-clinical-bg text-clinical-text font-sans antialiased h-screen overflow-hidden flex flex-col">
